name: stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.py]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render stats
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/stats.py stats.svg
          sed -i -E "s#stats\.svg(\?v=[0-9]+)?\"#stats.svg?v=$(date -u +%Y%m%d%H%M)\"#" README.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg README.md
          git diff --cached --quiet || (git commit -m "chore: update stats" && git pull --rebase && git push)
