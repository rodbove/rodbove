<style>
text { font-family: "SF Mono", "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.i { fill: #eceae4; } .d { fill: #6a6b6c; } .o { fill: #ff5b14; } .b { font-weight: 700; }
.lbl { fill: #454642; font-size: 8px; letter-spacing: 1px; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.blink { animation: blink 1s step-end infinite; }
@keyframes press { 0% { opacity: 0.55; } 6% { opacity: 0; } 100% { opacity: 0; } }
.press { opacity: 0; animation: press 9.0s linear infinite; }
@keyframes wheel { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
.wheel { animation: wheel 4s ease-in-out infinite; }
</style>
